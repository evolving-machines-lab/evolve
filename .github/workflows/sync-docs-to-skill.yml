# The served skills are generated from the docs — one source, generated copies.
# scripts/generate-skills.ts (npm run generate:skills) writes skill-data/evolve-agents
# from docs/, skill-data/evolve-evals from docs-mintlify/, the served copy and the
# .claude/skills/ mirror of the pointer skills/evolve/SKILL.md, and skills-lock.json.
# Two jobs, one generator:
#   - pull requests: `--check` fails when a generated copy is stale, missing, or
#     hand-edited (the same law as the SDK's harness-capabilities --check);
#   - pushes to a trunk: regenerate and commit, so a docs edit lands in the
#     skills with no hand step.
name: Sync docs to skills

on:
  push:
    branches: [main, project-sable]
  pull_request:
    branches: [main, project-sable]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check the generated skills against their sources
        run: npm run generate:skills -- --check

      # Every skill we ship is a SKILL.md that passes the Agent Skills
      # specification (owner's rule 2026-09-16): the pointer under skills/ and
      # every folder under skill-data/, generated or hand-written. skills-ref
      # is the specification's own validator, pinned; pipx ships on
      # ubuntu-latest, so nothing is checked in for it. One failure fails the step.
      - name: Validate every skill against the Agent Skills specification
        run: |
          for dir in skills/*/ skill-data/*/; do
            pipx run --spec skills-ref==0.1.1 agentskills validate "${dir%/}"
          done

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # persist-credentials is off so the workflow token is not in .git/config
      # while `npm ci` runs third-party install scripts (see tests.yml); the
      # push step below passes the token on its own command line instead.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate the skills
        run: npm run generate:skills

      # Every skill we ship is a SKILL.md that passes the Agent Skills
      # specification (owner's rule 2026-09-16): the pointer under skills/ and
      # every folder under skill-data/, generated or hand-written. skills-ref
      # is the specification's own validator, pinned; pipx ships on
      # ubuntu-latest, so nothing is checked in for it. One failure fails the step.
      - name: Validate every skill against the Agent Skills specification
        run: |
          for dir in skills/*/ skill-data/*/; do
            pipx run --spec skills-ref==0.1.1 agentskills validate "${dir%/}"
          done

      - name: Check for changes
        id: diff
        run: |
          git add -A skill-data .claude/skills skills-lock.json
          git diff --cached --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync skills from docs/ and docs-mintlify/"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$remote" "${GITHUB_REF_NAME}"
          git push "$remote" HEAD:"${GITHUB_REF_NAME}"
