# The cross-repo half of the contract drift gate. The OpenAPI contract lives
# in the PRIVATE server repo (swarm_dashboard/spec/openapi.yaml — the YAML is
# not a free download), so this public repo checks it out sparsely with a
# read token and runs only the spec-reading tests against it via
# EVOLVE_OPENAPI_SPEC_PATH. Without the token (forks, or before the owner
# mints SPEC_READ_TOKEN) every step skips and the job stays green — the same
# tests skip themselves locally when no spec is present.
name: Spec gate

on:
  push:
    branches: [main, project-sable, 'berth/**']
  pull_request:
    branches: [main, project-sable, 'berth/**']

permissions:
  contents: read

jobs:
  spec-gate:
    runs-on: ubuntu-latest
    env:
      EVOLVE_OPENAPI_SPEC_PATH: ${{ github.workspace }}/contract/spec/openapi.yaml
    steps:
      # Secrets cannot be referenced in `if:` directly, so the documented
      # pattern applies: export the secret into env, probe it in a step, and
      # gate every later step on the probe's output. The export is STEP-level
      # on purpose — a job-level env would hand the private-repo token to
      # `npm ci` and `pip install` too, where third-party install scripts run.
      - name: Probe for the contract-read token
        id: token
        env:
          SPEC_READ_TOKEN: ${{ secrets.SPEC_READ_TOKEN }}
        run: echo "present=${SPEC_READ_TOKEN:+true}" >> "$GITHUB_OUTPUT"

      # persist-credentials defaults TRUE and writes the checkout token into
      # .git/config for the life of the job — the same third-party window
      # (`npm ci` / `pip install` scripts) the step-scoped env above avoids.
      # No later step fetches or pushes, so nothing here needs persisted
      # credentials; the contract checkout would otherwise leave
      # SPEC_READ_TOKEN readable on disk while third-party code runs.
      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The contract must come from the server branch PAIRED with this ref:
      # same branch name first (berth/* trains), then the integration line,
      # then trunk. Without it a berth-train run reads the server's default
      # branch, finds no spec, and the gate goes green-with-skip while looking
      # armed.
      #
      # TWIN: .github/workflows/publish.yml carries this same step. The two
      # run: bodies are kept BYTE-IDENTICAL on purpose — one law, two spellings
      # — so a change to the candidate order or to the failure handling lands
      # in both or in neither. Edit one, edit the other.
      - name: Resolve contract ref
        if: steps.token.outputs.present == 'true'
        id: contractref
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          TOKEN: ${{ secrets.SPEC_READ_TOKEN }}
        run: |
          # REST probe, not git ls-remote: fine-grained PATs authenticate
          # plainly as Bearer on the API, while ls-remote's basic-auth styles
          # are inconsistent for them (the first run fell through to main
          # because every probe silently 401'd).
          #
          # ONLY 404 means "no such branch". Every other non-200 is the PROBE
          # failing, not an answer about the branch: an expired, under-scoped
          # or rate-limited token replies 401/403/429, and reading that as
          # "absent" would walk the whole candidate list and gate against the
          # WRONG contract while the job looked healthy. So anything that is
          # neither 200 nor 404 stops the job here and prints the code.
          for ref in "$BRANCH" berth/day-one project-sable main; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/evolving-machines-lab/swarm_dashboard/branches/${ref}")
            if [ "$code" = "200" ]; then
              echo "ref=$ref" >> "$GITHUB_OUTPUT"
              echo "resolved contract ref: $ref"
              exit 0
            fi
            if [ "$code" != "404" ]; then
              echo "::error::contract-ref probe for '${ref}' answered HTTP ${code}; only 404 means the branch is absent. SPEC_READ_TOKEN is expired, under-scoped or rate-limited — refusing to gate against a branch this probe never confirmed."
              exit 1
            fi
            echo "contract ref '${ref}': absent (404)"
          done
          echo "::error::no contract branch found — every candidate answered 404 ($BRANCH, berth/day-one, project-sable, main). The server repo has no branch this ref can pair with."
          exit 1

      - name: Checkout the contract (private server repo, spec/ only)
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: evolving-machines-lab/swarm_dashboard
          ref: ${{ steps.contractref.outputs.ref }}
          token: ${{ secrets.SPEC_READ_TOKEN }}
          path: contract
          sparse-checkout: spec
          persist-credentials: false

      - name: Setup Node.js
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: packages/sdk-py/requirements-dev.txt

      - name: Install Python test dependencies
        if: steps.token.outputs.present == 'true'
        run: pip install -r packages/sdk-py/requirements-dev.txt

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: npm ci

      - name: Build all packages
        if: steps.token.outputs.present == 'true'
        run: npm run build

      # One list, one home: scripts/run-spec-gates.sh is the same script
      # publish.yml and the server repo's sdk-spec-gate.yml run — see its
      # header. This job runs it tolerant (EVOLVE_SPEC_GATE_STRICT unset): the
      # spec may lead the SDK on a topic branch, and only the release gate
      # demands full equality.
      - name: Run the spec gates
        if: steps.token.outputs.present == 'true'
        run: scripts/run-spec-gates.sh
