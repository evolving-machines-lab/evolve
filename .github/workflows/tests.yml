name: Tests

on:
  push:
    branches: [main, project-sable, 'berth/**']
  pull_request:
    branches: [main, project-sable, 'berth/**']

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run TypeScript unit tests
        run: npm run test:ts:unit

  # The Python SDK drives a bundled Node.js bridge (packages/sdk-py/bridge),
  # so this job needs Node + a full workspace build before pytest can run.
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: packages/sdk-py/requirements-dev.txt

      - name: Install Python test dependencies
        run: pip install -r packages/sdk-py/requirements-dev.txt

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run Python unit tests
        run: npm run test:py:unit
