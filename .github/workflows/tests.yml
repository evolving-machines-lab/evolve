name: Tests

on:
  push:
    branches: [main, project-sable, 'berth/**']
  pull_request:
    branches: [main, project-sable, 'berth/**']

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      # No step here pushes or re-fetches, so don't leave the workflow token
      # in .git/config while `npm ci` / `pip install` run third-party scripts
      # (actions/checkout persists it by default).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run TypeScript unit tests
        run: npm run test:ts:unit

  # The Python SDK drives a bundled Node.js bridge (packages/sdk-py/bridge),
  # so this job needs Node + a full workspace build before pytest can run.
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: packages/sdk-py/requirements-dev.txt

      - name: Install Python test dependencies
        run: pip install -r packages/sdk-py/requirements-dev.txt

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run Python unit tests
        run: npm run test:py:unit

  # skills/harbor-task/ is hand-written, so nothing regenerates it and nothing
  # pushes it — this job only CHECKS. It keeps the two skill copies from drifting
  # and holds the skill's own examples to the acceptance bar they document.
  harbor-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the .claude/skills mirror is identical
        run: |
          if ! diff -r skills/harbor-task .claude/skills/harbor-task; then
            echo "::error::skills/harbor-task and .claude/skills/harbor-task have drifted."
            echo "Edit skills/harbor-task/, then refresh the mirror:"
            echo "  rm -rf .claude/skills/harbor-task && cp -r skills/harbor-task .claude/skills/harbor-task"
            exit 1
          fi

      # The SMDD example's grader computes RDKit descriptors. goldnull.py runs
      # the verifier with THIS interpreter, so prove the import here — otherwise a
      # dependency problem surfaces as a misleading "gold must be 1.0" failure.
      - name: Install example grader dependencies
        run: |
          pip install 'rdkit==2026.3.5'
          python3 -c 'import rdkit; print("rdkit", rdkit.__version__)'

      - name: Lint the example tasks
        run: python3 skills/harbor-task/scripts/validate_task.py skills/harbor-task/examples/tasks/*

      - name: Gold/null — every example must score 1.0 gold and 0.0 null
        run: python3 skills/harbor-task/scripts/goldnull.py skills/harbor-task/examples/tasks/*
