# =============================================================================
# Image refresh — from "a maintainer changed the image" to "users have it",
# with no human step in between.
# =============================================================================
#
# WHAT EACH KIND OF USER GETS, AND WHEN. The four consumers of this image do
# not move the same way, and pretending they do is what used to leave one of
# them behind:
#
#   E2B              rebuilt in place here. The alias `evolve-all` resolves to
#                    the newest successful build, so E2B users are moved when
#                    this workflow finishes. Nothing to release.
#   managed Daytona  repointed here (see the refresh script). Managed users are
#                    moved when this workflow finishes. Nothing to release.
#   direct Daytona   default snapshot name is `evolve-all-c-<12hex>`, which
#                    comes from a constant compiled into the published package.
#                    They move on the NEXT npm release. This workflow pre-builds
#                    that snapshot so it is warm when they arrive.
#   Modal            default image ref carries the same constant. Same story:
#                    they move on the next npm release.
#
# So steps c/d below finish the job for two providers, and the PR in step e is
# what eventually finishes it for the other two.
#
# TRIGGERS
#   push to main touching assets/docker/** or assets/e2b/**
#                    the normal path: a maintainer edited the image. Does NOT
#                    bump the stamp — the edit already moved the content hash.
#   cron, Mon + Thu  the freshness run, and it FORCES. Nearly every tool in the
#                    image installs at @latest, so the recipe text can sit
#                    unchanged for weeks while what it installs moves. A
#                    scheduled run that derived the same tag would rebuild
#                    nothing and ship nothing, which defeats the point of
#                    having a schedule — so scheduled runs bump the refresh
#                    stamp and go all the way through: new tag, new image, new
#                    E2B template, repointed Daytona, merged constants, release.
#   workflow_dispatch
#                    force_refresh: same forcing behaviour, on demand.
#                    dry_run: report what every step would do, change nothing.
#
# ZERO-TOUCH RELEASE — SCOPE OF THE AUTHORIZATION
# Owner ruling of 2026-08-16: the constants PR this workflow opens must not wait
# on a human. It is therefore merged and released BY the pipeline. That standing
# authorization covers THIS machine-generated flow ONLY — it is not a general
# policy that automation may merge to main. Two guardrails keep it that narrow,
# and both must pass or the PR is left alone for a person to look at:
#   1. the PR must have been opened by this run, and
#   2. its diff must contain NOTHING except the generated version constants and
#      the refresh stamp — verified against an allowlist by reading the PR's own
#      file list back from the API, not by trusting what we think we committed.
# Anything else in that diff means something unexpected happened, and the right
# response to "unexpected" is a human, not a merge.

name: Image refresh

on:
  push:
    branches: [main]
    paths:
      - 'assets/docker/**'
      - 'assets/e2b/**'
  schedule:
    # Twice a week, Monday and Thursday at 05:17 UTC — a quiet hour (mid-evening
    # US Pacific, pre-dawn Europe) and off the hour, so it neither lands in
    # anyone's working day nor queues behind every other midnight cron.
    - cron: '17 5 * * 1'
    - cron: '17 5 * * 4'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Bump the refresh stamp so a new image tag is derived and everything rebuilds from today''s upstream tools'
        type: boolean
        default: false
      dry_run:
        description: 'Report what each step would do and change nothing'
        type: boolean
        default: false

# One refresh at a time, and never cancel one midway: a cancelled run can leave
# the platform snapshot deleted and not yet rebuilt.
concurrency:
  group: image-refresh
  cancel-in-progress: false

# contents: push the branch and merge it. pull-requests: open the PR.
# actions: dispatch publish.yml afterwards — `workflow_dispatch` is one of the
# two documented exceptions to "events triggered by GITHUB_TOKEN do not create a
# new workflow run", so the release really does start.
permissions:
  contents: write
  pull-requests: write
  actions: write

# The release the pipeline cuts once the constants land. `stable` because that
# is the only thing that moves anyone: Modal and direct-Daytona users resolve
# their defaults from the published packages, and a dev-tagged publish would
# leave them exactly where they were. One place to change the cadence's blast
# radius if it ever needs dialling back.
env:
  PUBLISH_RELEASE_TYPE: stable
  PUBLISH_VERSION_BUMP: patch

jobs:
  refresh:
    name: Refresh evolve-all everywhere
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # persist-credentials: false — third-party install scripts run in this job
      # (npm ci, and the image build itself), and the workflow token should not
      # be sitting in .git/config while they do. The PR step at the end pushes
      # with an explicit, short-lived remote URL instead.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # (a) THE CONTENT VERSION
      # -----------------------------------------------------------------------

      # A scheduled run forces, always. The schedule exists precisely because
      # the image drifts WITHOUT the recipe changing (@latest everywhere), and a
      # scheduled run that respected the unchanged content hash would derive the
      # same tag, skip the build, and ship nothing twice a week.
      - name: Decide whether this run forces a new image
        id: mode
        env:
          FORCE_INPUT: ${{ inputs.force_refresh }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${FORCE_INPUT:-false}" = "true" ]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
            echo "This run FORCES a new image tag."
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
            echo "This run releases only if the build inputs actually changed."
          fi

      # The CODED force: the stamp is an ordinary file in the docker build
      # context, so image-digest.ts already hashes it, and the Dockerfile COPYs
      # it to /etc/evolve-image-refresh so it is real image content. The writer
      # exits non-zero if the stamp did not actually move.
      - name: Bump the refresh stamp
        if: steps.mode.outputs.force == 'true'
        run: npx tsx assets/docker/write-refresh-stamp.ts "${{ github.event_name }} run ${{ github.run_id }} attempt ${{ github.run_attempt }}"

      - name: Derive the image version
        id: version
        run: |
          set -euo pipefail
          npx tsx assets/docker/generate-image-version.ts
          # Read the version back out of the constant the generator just wrote,
          # with the same regex the coherence test uses — no dependence on the
          # generator's log wording.
          version="$(node -e "
            const s = require('fs').readFileSync('assets/docker/image-version.ts', 'utf8');
            const m = /EVOLVE_IMAGE_VERSION\s*=\s*'([^']+)'/.exec(s);
            if (!m) process.exit(1);
            process.stdout.write(m[1]);
          ")"
          if [ -z "$version" ]; then
            echo "::error::Could not derive the image version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=evolvingmachines/evolve-all:$version" >> "$GITHUB_OUTPUT"
          echo "Derived $version"
          # Did generation change the checked-in constants? Only a stamp bump
          # (or a Dockerfile edit pushed without regenerating) can do that.
          if git diff --quiet -- assets/docker/image-version.ts packages/modal/src/image-version.ts packages/daytona/src/image-version.ts; then
            echo "constants_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "constants_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # (b) DOCKER HUB — build and push the derived tag if it is not there yet
      # -----------------------------------------------------------------------

      # Hard failure, not the publish workflow's warn-and-skip: that one can
      # fall back on "an operator will push it", while this workflow's whole
      # purpose is that no operator has to. Everything after this step assumes
      # the image is on Docker Hub.
      - name: Check Docker Hub credentials
        if: inputs.dry_run != true
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DH_USER:-}" ] || [ -z "${DH_TOKEN:-}" ]; then
            echo "::error::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not configured — the image cannot be pushed and the Daytona/E2B steps would ship a stale image."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: inputs.dry_run != true
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DH_TOKEN" | docker login --username "$DH_USER" --password-stdin

      # build.ts stays the single source of the tag/push rules — this workflow
      # never reimplements them. It is idempotent by design: when the derived
      # tag is already on Docker Hub the build is skipped and only :latest is
      # realigned server-side, so an unchanged weekly run costs one API call.
      - name: Build and push the image
        if: inputs.dry_run != true
        run: npx tsx assets/docker/build.ts

      - name: Report what would be pushed
        if: inputs.dry_run == true
        run: echo "DRY RUN — would run 'npx tsx assets/docker/build.ts' for ${{ steps.version.outputs.image }}"

      # -----------------------------------------------------------------------
      # (c) E2B — rebuilt in place; users move the moment this lands
      # -----------------------------------------------------------------------

      # build.ts verifies against E2B's own record afterwards (a NEW build id
      # whose status is `ready`), because the builder resolving is only the
      # builder's opinion — and because this script used to exit 0 on failure.
      - name: Rebuild the E2B template
        if: inputs.dry_run != true
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: npx tsx assets/e2b/build.ts

      # -----------------------------------------------------------------------
      # (d) DAYTONA — versioned snapshot, then the managed platform name
      # -----------------------------------------------------------------------

      # Daytona has no rename and no in-place update for a snapshot, so the
      # stable managed name can only be moved by delete-then-create. The script
      # builds the versioned snapshot FIRST and refuses to continue unless it
      # goes active, so the release image is proven in this org before anything
      # live is deleted, and it rolls the name back to the previous image if the
      # rebuild fails. See its header for the full reasoning and citations.
      - name: Repoint managed Daytona
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: npx tsx assets/daytona/refresh-platform-snapshot.ts ${{ inputs.dry_run == true && '--dry-run' || '' }}

      # -----------------------------------------------------------------------
      # (e) THE PR — opened, gated, merged and released without a human
      # -----------------------------------------------------------------------

      # TOKEN CHOICE. RELEASE_PAT when it exists, GITHUB_TOKEN otherwise, and
      # the difference is not cosmetic. GitHub documents two limits on
      # GITHUB_TOKEN that both bite exactly here:
      #   - the org setting "Allow GitHub Actions to create and approve pull
      #     requests" governs whether GITHUB_TOKEN may CREATE a PR at all, and
      #     this org currently says no;
      #   - a PR opened with GITHUB_TOKEN gets its `pull_request` CI runs
      #     created in an approval-required state, waiting on a human click.
      # A PAT is the documented way out of both. The flow is written to work
      # either way, so adding the secret upgrades it with no code change.
      - name: Open a PR for the regenerated constants
        id: pr
        if: steps.version.outputs.constants_changed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          set -euo pipefail
          branch="image-refresh/${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add assets/docker/refresh-stamp \
                  assets/docker/image-version.ts \
                  packages/modal/src/image-version.ts \
                  packages/daytona/src/image-version.ts
          git commit -m "chore(image): refresh evolve-all to ${VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          {
            echo "Automated by \`.github/workflows/image-refresh.yml\` (run ${GITHUB_RUN_ID})."
            echo
            echo "The image \`${IMAGE}\` is already built and pushed to Docker Hub."
            echo
            echo "**Already moved — no release needed**"
            echo
            echo "- **E2B** — the \`evolve-all\` template was rebuilt in place and verified ready against the E2B API. E2B users are on it now."
            echo "- **Managed Daytona** — the platform snapshot \`evolve-all\` was repointed at this image and verified active. Managed users are on it now."
            echo
            echo "**Waiting on this PR**"
            echo
            echo "- **Modal** and **direct Daytona** resolve their defaults from the constants in this diff, and those ship compiled into the published packages. They move when this merges and the release publishes."
            echo
            echo "The versioned Daytona snapshot \`evolve-all-${VERSION}\` is already pre-built, so direct users get a warm snapshot instead of a first-use build."
            echo
            echo "---"
            echo
            echo "This PR is merged and released by the pipeline that opened it, with no human step, under the owner ruling of 2026-08-16. That applies only to a PR like this one, whose diff is nothing but the generated version constants and the refresh stamp — the workflow reads the file list back from the API and refuses to merge if anything else appears."
          } > /tmp/image-refresh-pr-body.md
          # The PR is attempted, not assumed. The organization currently blocks
          # "Allow GitHub Actions to create and approve pull requests", which
          # makes `gh pr create` fail with the branch already pushed — and the
          # image already live everywhere it does not need a release. Failing
          # the job there would report a broken refresh that in fact succeeded,
          # so this degrades to a one-click link instead. Turn the org setting
          # on and this branch stops being needed.
          compare="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          if url="$(gh pr create \
               --base main \
               --head "$branch" \
               --title "chore(image): refresh evolve-all to ${VERSION}" \
               --body-file /tmp/image-refresh-pr-body.md)"
          then
            echo "Opened ${url}"
            # gh prints the PR URL, but it is not contractually the ONLY thing
            # on stdout — a notice or a hint can ride along. Take the last line,
            # keep the trailing path segment, and require it to be digits;
            # anything else means the parse is not trustworthy, so ask the API
            # for the number instead of merging against a guess.
            number="$(printf '%s\n' "$url" | tail -n 1)"
            number="${number##*/}"
            if ! printf '%s' "$number" | grep -Eq '^[0-9]+$'; then
              echo "Could not read a PR number from gh output; asking the API."
              number="$(gh pr view "$branch" --json number --jq '.number')"
            fi
            if ! printf '%s' "$number" | grep -Eq '^[0-9]+$'; then
              echo "::error::Opened a PR but could not determine its number — refusing to continue."
              exit 1
            fi
            echo "PR number: ${number}"
            echo "opened=true" >> "$GITHUB_OUTPUT"
            echo "number=${number}" >> "$GITHUB_OUTPUT"
          else
            # The branch is pushed and the image is already live everywhere that
            # does not need a release, so a refusal here is not a broken
            # refresh. Degrade to a one-click link rather than failing red.
            echo "opened=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not open the PR automatically. Branch '${branch}' IS pushed; open it at ${compare}"
            {
              echo "### Image refreshed to \`${VERSION}\` — PR needs one click"
              echo
              echo "Branch \`${branch}\` is pushed but the pull request could not be opened, so open it here: [${compare}](${compare})"
              echo
              echo "The usual cause is the **Allow GitHub Actions to create and approve pull requests** setting being off at the organization or repository level. Check the step log above for what \`gh\` actually said. Adding a \`RELEASE_PAT\` repository secret also sidesteps it."
              echo
              echo "E2B and managed Daytona users are already on this image. This PR only moves Modal and direct Daytona."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # GATE 1. main carries no required status checks, and a GITHUB_TOKEN-
      # authored PR has its `pull_request` CI held in an approval-required
      # state — so waiting on "the PR's checks" would wait forever. This job
      # runs the suite itself instead, against exactly the content about to be
      # merged, and a failure here stops the merge by stopping the job.
      - name: Gate — build and unit tests must pass before anything merges
        if: steps.pr.outputs.opened == 'true'
        run: |
          npm run build
          npm run test:ts:unit

      # GATE 2. The narrow scope of the owner's auto-merge authorization, made
      # mechanical. The PR's OWN file list is read back from the API — not the
      # list this job thinks it committed — and every path must be one of the
      # four generated artefacts. Anything else means something unexpected got
      # swept in, and unexpected is a human's problem, not a merge candidate.
      - name: Gate — the PR may contain only the generated constants
        id: guard
        if: steps.pr.outputs.opened == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          is_allowed() {
            case "$1" in
              assets/docker/refresh-stamp) return 0 ;;
              assets/docker/image-version.ts) return 0 ;;
              packages/modal/src/image-version.ts) return 0 ;;
              packages/daytona/src/image-version.ts) return 0 ;;
              *) return 1 ;;
            esac
          }
          gh pr view "$PR" --json files --jq '.files[].path' > /tmp/pr-files.txt
          echo "Files in PR #${PR}:"
          sed 's/^/  /' /tmp/pr-files.txt
          # An empty list is not "nothing unexpected" — it is a read that told
          # us nothing, and merging on it would defeat the whole check.
          if [ ! -s /tmp/pr-files.txt ]; then
            echo "::warning::PR #${PR} reported no files — refusing to auto-merge."
            echo "safe=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          unexpected=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if is_allowed "$path"; then continue; fi
            echo "  ^ NOT a generated constant"
            unexpected=1
          done < /tmp/pr-files.txt
          if [ "$unexpected" -eq 1 ]; then
            echo "safe=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PR #${PR} touches files outside the generated constants — leaving it open for a human."
            {
              echo "### PR #${PR} left open on purpose"
              echo
              echo "It contains files beyond the generated version constants, so the pipeline did not merge it. Review it by hand."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "safe=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the constants PR and cut the release
        if: steps.pr.outputs.opened == 'true' && steps.guard.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Auto-merge FIRST, so that the day main gains a required check this
          # starts respecting it instead of bypassing it. When nothing blocks
          # the PR, GitHub refuses to enable auto-merge at all — the option
          # exists only for a PR that cannot merge immediately — so fall back to
          # merging outright. The two gates above are what stands in for the
          # missing required check, which is the whole reason they are gates and
          # not conveniences.
          if gh pr merge "$PR" --auto --squash --delete-branch; then
            echo "Auto-merge enabled on #${PR}."
          else
            echo "::notice::Auto-merge unavailable (nothing on main blocks this PR) — merging directly, gated by the build/test step above."
            gh pr merge "$PR" --squash --delete-branch || true
          fi

          merged=false
          for _ in $(seq 1 60); do
            if [ "$(gh pr view "$PR" --json merged --jq '.merged')" = "true" ]; then
              merged=true
              break
            fi
            sleep 10
          done

          # Not merging is not a failed refresh: the image is built, E2B and
          # managed Daytona are already serving it. Only the release is owed.
          if [ "$merged" != "true" ]; then
            echo "::warning::PR #${PR} did not merge within 10 minutes — the release was NOT dispatched."
            {
              echo "### Image \`${VERSION}\` is live, release still owed"
              echo
              echo "PR #${PR} is open and did not merge automatically, so \`publish.yml\` was not dispatched. E2B and managed Daytona users are already on this image; Modal and direct Daytona move once it merges and publishes."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Merged. Dispatching publish.yml (${PUBLISH_RELEASE_TYPE}/${PUBLISH_VERSION_BUMP})..."
          # workflow_dispatch is one of the two documented exceptions to the
          # GITHUB_TOKEN recursion rule, so this really does start a run.
          gh workflow run publish.yml --ref main \
            -f release_type="${PUBLISH_RELEASE_TYPE}" \
            -f version_bump="${PUBLISH_VERSION_BUMP}" \
            -f dry_run=false
          {
            echo "### Image refreshed to \`${VERSION}\` — shipped end to end"
            echo
            echo "- E2B template rebuilt and verified ready"
            echo "- Managed Daytona snapshot repointed and verified active"
            echo "- PR #${PR} merged"
            echo "- \`publish.yml\` dispatched (${PUBLISH_RELEASE_TYPE}/${PUBLISH_VERSION_BUMP}) to move Modal and direct Daytona"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Say what still needs a release
        if: steps.version.outputs.constants_changed != 'true'
        run: echo "Constants unchanged (${{ steps.version.outputs.version }}) — E2B and managed Daytona were refreshed in place; nothing to release."
